# Sits in front of the app. Put Supreme's HTTPS load balancer or reverse proxy in front of this,
# or add their certificate here (listen 443 ssl).
# This file is a template: the nginx image fills in ${TRUSTED_PROXY} from docker-compose when it starts.

# Keep the scheme the outer proxy saw; fall back to this server's own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Who is the visitor? Only Supreme's proxy may say, through X-Forwarded-For. Addresses a browser adds itself
# are ignored, so nobody can dodge the limits below by inventing addresses.
set_real_ip_from ${TRUSTED_PROXY};
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Request limits per visitor. Generous, because an office behind one network address shares a budget;
# per-person limits live in the app.
limit_req_zone $binary_remote_addr zone=pages:10m rate=50r/s;
# Only password attempts (POST) count towards the sign-in limit; an empty key is never limited.
map $request_method $password_attempt {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $password_attempt zone=signin:10m rate=10r/m;

server {
    listen 80;
    server_tokens off;
    limit_req_status 429;

    # The app allows 250 MB of photos and videos per post; the extra room is for the post's text.
    client_max_body_size 260m;
    client_body_timeout 300s;

    location / {
        limit_req zone=pages burst=200 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    # Password sign-in (emergency admin only): slow enough to stop password guessing.
    # Single sign-on (/oidc/) is left out: Microsoft handles that, and it runs every 15 minutes per person.
    location = /login/ {
        limit_req zone=signin burst=20 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # The app checks the visitor is signed in, then hands the file to nginx with X-Accel-Redirect.
    # "internal" means nobody can fetch these paths directly.
    location /protected-media/ {
        internal;
        alias /data/media/;
        add_header X-Content-Type-Options nosniff;
    }
}
